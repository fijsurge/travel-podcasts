# Turns episodes/*.md into natural-sounding MP3 audio with the free, open-source Kokoro model.
# Runs on GitHub's free runners (this repo is public). Only chapters whose text or voices changed are redone.
name: Generate audio

on:
  push:
    branches: [main]
    paths:
      - 'episodes/**'
      - 'tools/make_audio.py'
      - 'tools/build.py'
      - 'tools/pronunciations.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate all audio, even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

env:
  KOKORO_MODEL: models/kokoro-v1.0.int8.onnx
  KOKORO_VOICES: models/voices-v1.0.bin
  MODEL_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # newest main: runs wait in a queue, so the commit that started this run may be stale
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python tools/make_audio.py plan

  synth:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}  # the exact commit the plan was made from
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: model
        with:
          path: models
          key: kokoro-v1.0-int8
      - name: Download voice model (first run only)
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 4 -o models/kokoro-v1.0.int8.onnx "$MODEL_URL/kokoro-v1.0.int8.onnx"
          curl -fL --retry 4 -o models/voices-v1.0.bin "$MODEL_URL/voices-v1.0.bin"
      - name: Install ffmpeg (MP3 encoder)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - run: pip install kokoro-onnx==0.6.1 soundfile numpy
      - name: Synthesize chapter
        run: |
          python tools/make_audio.py chapter "${{ matrix.episode }}" "${{ matrix.chapter }}" 2> >(tee err.log >&2) || {
            echo "::error title=Audio synthesis failed::$(tail -n 8 err.log | tr '\n' '|' | cut -c1-1500)"
            exit 1
          }
      - name: Pack result
        run: |
          nn=$(printf '%02d' "${{ matrix.chapter }}")
          tar czf chapter.tgz "audio/${{ matrix.episode }}/$nn.mp3" "audio/${{ matrix.episode }}/$nn.json"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.episode }}-${{ matrix.chapter }}
          path: chapter.tgz
          retention-days: 2

  publish:
    needs: [plan, synth]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # newest main, not the commit that started this run (other runs may have published since)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true  # nothing to download when an episode was only deleted
        with:
          pattern: audio-*
          path: incoming
      - name: Rebuild library and audio manifest, commit, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          assemble() {
            for f in incoming/*/chapter.tgz; do [ -f "$f" ] && tar xzf "$f"; done
            python tools/build.py
            python tools/make_audio.py finalize
            git add audio library.json
          }
          assemble
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update generated audio and library"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt); rebuilding on the newest main"
            git fetch origin main
            git reset --hard origin/main
            assemble
            if git diff --cached --quiet; then echo "nothing left to commit"; exit 0; fi
            git commit -m "Update generated audio and library"
          done
          exit 1
